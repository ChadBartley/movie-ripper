services:
  arm:
    # Built locally from ./Dockerfile (extends upstream with rsync). Version
    # pin lives in the Dockerfile's FROM line.
    build:
      context: .
    image: movie-ripper-arm:2.24.3
    container_name: arm
    # No auto-start on boot: the container runs only when you start it. To
    # opt in, override `restart: unless-stopped` in a compose file of your
    # own listed in COMPOSE_FILE (see README).
    restart: "no"
    privileged: true
    runtime: nvidia
    ports:
      # Host port 8060: 8090 collides with too many other services' defaults.
      - "8060:8080"
    # Bind-mount host /dev so optical-drive hotplug propagates into the
    # container. Docker's `devices:` directive only creates a static node
    # at container start; when the host kernel re-registers /dev/sr0 on
    # disc insert, the container's tmpfs /dev never sees it and ARM logs
    # "We Cant find any system drives". Privileged + /dev:/dev is the
    # standard ARM-on-Linux recipe.
    environment:
      # ARM_UID/ARM_GID intentionally NOT set — they trigger a chown bug in
      # the entrypoint that breaks syslog-ng startup (upstream issue #1663,
      # still live in 2.23.2). Image defaults to uid 1000; ensure host
      # bind-mount dirs are 1000:1000.
      TZ: ${TZ}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - /dev:/dev
      - ./home:/home/arm
      - ./media:/home/arm/media
      - ./logs:/home/arm/logs
      - ./db:/home/arm/db
      - ./config:/etc/arm/config
      # The /mnt/jellyfin SMB mount lives in docker-compose.home.yml — it's
      # an at-home overlay so the container can start with the file server
      # unreachable (rip on the road, promote later). Enable it via
      # COMPOSE_FILE in .env; see .env.example.
      # Workaround: syslog-ng init fails on Arch/Manjaro Docker hosts
      # (phusion/baseimage-docker#540). ARM logs to /home/arm/logs/ via
      # Python, so disabling syslog-ng is safe.
      - ./scripts/noop-init.sh:/etc/my_init.d/10_syslog-ng.init:ro
